name: Update playlist

on:
  schedule:
    - cron: "0 4 * * *"   # щодня о 04:00 UTC
  workflow_dispatch:       # ручний запуск з вкладки Actions
  push:                    # перезбирати при зміні скриптів
    paths:
      - merge.py
      - gen_epg.py
      - .github/workflows/update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Playlist
        run: python merge.py

      # Телепрограма: якщо ці кроки впадуть, плейлист однаково оновиться
      - name: EPG prepare
        id: epg
        continue-on-error: true
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git /tmp/epg
          python gen_epg.py prepare playlist.m3u /tmp/epg/sites /tmp/custom.channels.xml | tee /tmp/prepare.log
          grep '^grab_needed=' /tmp/prepare.log >> "$GITHUB_OUTPUT"

      - name: EPG grab (дрібні сайти)
        if: steps.epg.outputs.grab_needed == 'true'
        continue-on-error: true
        run: |
          cd /tmp/epg
          npm ci --no-audit --no-fund
          npm run grab --- --channels=/tmp/custom.channels.xml --output=/tmp/grab.xml \
            --days=3 --maxConnections=3 --timeout=15000

      - name: EPG build
        if: steps.epg.outcome == 'success'
        continue-on-error: true
        run: python gen_epg.py build /tmp/custom.channels.xml /tmp/grab.xml guide.xml.gz

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add playlist.m3u
          [ -f guide.xml.gz ] && git add guide.xml.gz
          git diff --cached --quiet || git commit -m "Update playlist $(date -u +%F)"
          git push
